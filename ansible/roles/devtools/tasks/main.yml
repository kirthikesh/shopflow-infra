# Tools the jump box and pipeline agent need: Azure CLI, Terraform, kubectl, kubelogin,
# kustomize, Helm, Docker and Trivy.
# Packages come from each vendor's signed apt repository; kustomize from its checksum-verified release.

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add signing keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.name }}.asc"
    mode: "0644"
  loop: "{{ devtools_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add apt repositories
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/{{ item.name }}.asc] {{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
  loop: "{{ devtools_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install Azure CLI, Terraform, Docker and pipeline tools
  ansible.builtin.apt:
    name:
      - azure-cli
      - terraform
      - docker.io
      - docker-buildx
      - "trivy={{ devtools_trivy_version }}"
      - python3-venv # ansible-lint in the pipeline
      - make # the app pipeline runs its tests through the Makefile
      - jq
    state: present
    update_cache: true

- name: Install kubectl and kubelogin
  ansible.builtin.command:
    cmd: az aks install-cli --install-location /usr/local/bin/kubectl --kubelogin-install-location /usr/local/bin/kubelogin
    creates: /usr/local/bin/kubelogin

- name: Download kustomize (checksum verified)
  ansible.builtin.get_url:
    url: "{{ devtools_kustomize_base }}/kustomize_v{{ devtools_kustomize_version }}_linux_amd64.tar.gz"
    checksum: "sha256:{{ devtools_kustomize_base }}/checksums.txt"
    dest: /tmp/kustomize.tar.gz
    mode: "0644"
  vars:
    devtools_kustomize_base: "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv{{ devtools_kustomize_version }}"

- name: Install kustomize
  ansible.builtin.unarchive:
    src: /tmp/kustomize.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [kustomize]
    mode: "0755"
    creates: /usr/local/bin/kustomize

- name: Install Helm
  community.general.snap:
    name: helm
    classic: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Report installed versions
  ansible.builtin.shell: |
    set -o pipefail
    echo "az        $(az version --query '"azure-cli"' -o tsv)"
    echo "terraform $(terraform version -json | jq -r .terraform_version)"
    echo "kubectl   $(kubectl version --client -o json | jq -r .clientVersion.gitVersion)"
    echo "kubelogin $(kubelogin --version | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
    echo "helm      $(helm version --short)"
    echo "docker    $(docker --version)"
    echo "trivy     $(trivy --version | head -1)"
    echo "kustomize $(kustomize version)"
  args:
    executable: /bin/bash
  register: devtools_versions
  changed_when: false

- name: Show versions
  ansible.builtin.debug:
    var: devtools_versions.stdout_lines
