[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
stdout_callback    = default
result_format      = yaml
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Trust the host key the first time, then pin it (TOFU) in a project-local file.
ssh_args  = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts
pipelining = True
